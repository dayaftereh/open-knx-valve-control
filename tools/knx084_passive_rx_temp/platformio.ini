; KNX084: KNX-bus receive only, STKNX KNX_TX GPIO0 held LOW.
; Real ATtiny3216 temperature snapshots over RP2040 UART1 GPIO8/9.
; All eight TB6612 enable lines and two direction lines forced LOW.
; No KNX TX, no motor motion, no GPIO output HIGH on controlled pins.
; BOOTSEL/reset fail-low requires separate hardware validation.
[platformio]
default_envs = knx084_rx_temp

[env:knx084_rx_temp]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
platform_packages =
    framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/5.5.0/rp2040-5.5.0.zip
    toolchain-rp2040-earlephilhower @ https://github.com/earlephilhower/pico-quick-toolchain/releases/download/4.1.0/x86_64-w64-mingw32.arm-none-eabi-1aec55e.250530.zip
board = rpipico
board_build.core = earlephilhower
framework = arduino
build_flags =
    -std=c++17
    -DKNX084_RECEIVE_TEMP_ONLY=1
upload_protocol = custom
upload_command = cmd /c exit 91
monitor_speed = 115200
