[env:temperature]
platform = atmelmegaavr
board = ATtiny3216
board_build.f_cpu = 20000000L
lib_deps =
	SPI
	milesburton/DallasTemperature
build_src_filter =
	+<temperature/*>

monitor_rts = 0 # set RTS high for TX/RX
upload_protocol = custom
extra_scripts =
	pre:./assets/init_updi.py # configures the UPDI_FLAGS
	pre:./assets/autodetect_port.py # finds the UPLOAD/MONITOR port
upload_flags =
	--filename
	$SOURCE
upload_command = pymcuprog $UPDI_FLAGS $UPLOAD_FLAGS --uart $UPLOAD_PORT