[env:controller]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/5.5.0/rp2040-5.5.0.zip
board = rpipico
board_build.core = earlephilhower

build_src_filter =
	+<controller/*>

extra_scripts =
	pre:./assets/open-knx-producer.py

board_upload.maximum_size = 16777216 ; 16MiB (Total size of the flash)
board_build.filesystem_size = 15724544 ; 15MiB (16MiB - 1MiB - 4096 bytes)

lib_deps =
	https://github.com/OpenKNX/knx.git
	robtillaart/INA219@^0.4.1
	robtillaart/PCF8574@^0.4.1

build_flags =
	-DMASK_VERSION=0x07B0
	-DKNX_FLASH_SIZE=4096
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
	-Wno-unknown-pragmas