[env:controller]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#cc24cfef37ed22ca9f2a6aead28c2deb76c39f24
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/5.4.4/rp2040-5.4.4.zip
board = rpipico
board_build.core = earlephilhower

build_src_filter =
	+<controller/*>

lib_deps =
	knx
	https://github.com/OpenKNX/tpuart.git
	robtillaart/INA219@^0.4.1
	robtillaart/PCF8574@^0.4.1

build_flags =
	-DMASK_VERSION=0x07B0
	-DKNX_FLASH_SIZE=4096
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
	-Wno-unknown-pragmas