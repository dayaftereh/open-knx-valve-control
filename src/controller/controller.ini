[env:controller]
framework = arduino
; KNX028: Home-verified maxgerhardt PlatformIO revision (raspberrypi 1.20.0).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
; KNX028: reproducible toolchain. GCC 16.1.0 broke Arduino-Pico 5.5.0
; with __getreent not declared (framework malloc-lock.cpp). GCC 14.3.0
; matches the previously verified successful LLO Desktop controller build.
platform_packages =
    framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/5.5.0/rp2040-5.5.0.zip
    toolchain-rp2040-earlephilhower @ https://github.com/earlephilhower/pico-quick-toolchain/releases/download/4.1.0/x86_64-w64-mingw32.arm-none-eabi-1aec55e.250530.zip
board = rpipico
board_build.core = earlephilhower
; KNX027: PlatformIO picotool triggers Arduino-Pico CDC 1200-baud reset
; when the target already runs a responsive USB-Serial firmware.
; First/recovery flash may still need BOOTSEL/ROM UF2.
upload_protocol = picotool

build_src_filter =
	+<controller/*>

extra_scripts =
	pre:./assets/open-knx-producer.py

board_upload.maximum_size = 16777216 ; 16MiB (Total size of the flash)
board_build.filesystem_size = 15724544 ; 15MiB (16MiB - 1MiB - 4096 bytes)

lib_deps =
	https://github.com/OpenKNX/knx.git
	robtillaart/INA219@^0.4.1
	robtillaart/PCF8574@^0.4.1

build_flags =
	-DMASK_VERSION=0x07B0
	-DKNX_FLASH_SIZE=4096
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
	-Wno-unknown-pragmas